<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Distros Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">🐧 Linux Distros Explorer</h1>
                <p class="subtitle">Discover and explore the best Linux distributions</p>
            </div>
        </header>

        <!-- Search & Filter Section -->
        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search distros, categories..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="debian">Debian-based</button>
                <button class="filter-btn" data-category="redhat">Red Hat-based</button>
                <button class="filter-btn" data-category="arch">Arch-based</button>
                <button class="filter-btn" data-category="independent">Independent</button>
                <button class="filter-btn" data-category="specialized">Specialized</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalDistros">0</span>
                <span class="stat-label">Total Distros</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="totalCategories">0</span>
                <span class="stat-label">Categories</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="resultsCount">0</span>
                <span class="stat-label">Results Found</span>
            </div>
        </div>

        <!-- Distros Grid -->
        <div class="distros-container" id="distrosContainer">
            <!-- Distro cards will be injected here -->
        </div>

        <!-- No Results Message -->
        <div class="no-results" id="noResults" style="display: none;">
            <p>No distros found. Try adjusting your search or filters.</p>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Linux Distros Explorer | Built with ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
